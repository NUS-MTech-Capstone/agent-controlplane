openapi: 3.1.0
info:
  title: DenDenMushi Agent Control Plane API
  version: 0.1.0
  description: 'Agentic AI API and internal bounded automation control plane. Business endpoints require the `x-api-version:
    1` header; probe and OpenAPI endpoints are exempt.'
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
  /readyz:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /agentic-ai/health:
    get:
      summary: Agentic AI operational health
      security:
      - albCognito: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHealth'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /alerts:
    get:
      summary: List managed-server alerts
      security:
      - albCognito: []
      parameters:
      - name: incidentId
        in: query
        schema:
          type: string
      - name: hostId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: cloudwatchState
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: string
        description: Nonnegative integer text; malformed or negative values use the default. The store bounds page
          size.
      - name: cursor
        in: query
        schema:
          type: string
        description: Nonnegative integer text; malformed or negative values use the default. The store bounds page
          size.
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /alerts/{alertId}:
    get:
      summary: Get one managed-server alert
      security:
      - albCognito: []
      parameters:
      - name: alertId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '404':
          description: Alert not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /incidents:
    get:
      summary: List incidents
      security:
      - albCognito: []
      parameters:
      - name: incidentId
        in: query
        schema:
          type: string
      - name: alertId
        in: query
        schema:
          type: string
      - name: hostId
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: string
        description: Nonnegative integer text; malformed or negative values use the default. The store bounds page
          size.
      - name: cursor
        in: query
        schema:
          type: string
        description: Nonnegative integer text; malformed or negative values use the default. The store bounds page
          size.
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      description: 'Send Accept: application/json for the JSON contract; otherwise returns the operator HTML view.'
  /incidents/events:
    get:
      summary: Query Agentic AI incident timeline metadata events
      security:
      - albCognito: []
      parameters:
      - name: incidentId
        in: query
        schema:
          type: string
      - name: alertId
        in: query
        schema:
          type: string
      - name: eventType
        in: query
        schema:
          type: string
      - name: actor
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: string
        description: Nonnegative integer text; malformed or negative values use the default. The store bounds page
          size.
      - name: cursor
        in: query
        schema:
          type: string
        description: Nonnegative integer text; malformed or negative values use the default. The store bounds page
          size.
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEventListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /incidents/{incidentId}:
    get:
      summary: Get one incident
      security:
      - albCognito: []
      parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
            text/html:
              schema:
                type: string
        '404':
          description: Incident not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      description: 'Send Accept: application/json for the JSON contract; otherwise returns the operator HTML view.'
  /incidents/{incidentId}/approve:
    post:
      summary: Approve an exact stored remediation plan
      security:
      - albCognito: []
      parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '403':
          description: Manager or Admin group required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Plan hash drift or expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/Error'
        '303':
          description: HTML form callers redirect to the incident detail.
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planHash:
                  type: string
                  minLength: 1
                  pattern: \S
              required:
              - planHash
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                planHash:
                  type: string
                  minLength: 1
                  pattern: \S
              required:
              - planHash
  /incidents/{incidentId}/reject:
    post:
      summary: Reject an exact stored remediation plan
      security:
      - albCognito: []
      parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '400':
          $ref: '#/components/responses/Error'
        '303':
          description: HTML form callers redirect to the incident detail.
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planHash:
                  type: string
                  minLength: 1
                  pattern: \S
              required:
              - planHash
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                planHash:
                  type: string
                  minLength: 1
                  pattern: \S
              required:
              - planHash
  /automation/runs/start:
    post:
      summary: Start a bounded automation run
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Assigned run. capabilityToken is empty and tokenExpiresAt is the zero timestamp; request
            authority separately at /token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRunResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationRunRequest'
  /automation/runs/{runId}/token:
    post:
      summary: Issue a state-checked capability to the authenticated Tool Gateway
      security:
      - bearerAuth: []
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRunResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationTokenRequest'
  /automation/runs/{runId}/close:
    post:
      summary: Close an automation run for the authenticated coordinator
      security:
      - bearerAuth: []
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '204':
          description: Closed.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /openapi.yaml:
    get:
      summary: Checked-in OpenAPI specification
      responses:
        '200':
          description: Exact api/openapi.yaml bytes.
          content:
            application/yaml:
              schema:
                type: string
      security: []
components:
  securitySchemes:
    albCognito:
      type: apiKey
      in: header
      name: x-amzn-oidc-data
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    IncidentExplanation:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/ExplanationAgent'
          type:
          - array
          - 'null'
        guardrails:
          items:
            $ref: '#/components/schemas/ExplanationGuardrail'
          type:
          - array
          - 'null'
        model:
          $ref: '#/components/schemas/ExplanationModel'
        responsibility:
          $ref: '#/components/schemas/ExplanationResponsibility'
        toolDecisions:
          items:
            $ref: '#/components/schemas/ExplanationToolDecision'
          type:
          - array
          - 'null'
        trace:
          $ref: '#/components/schemas/ExplanationTrace'
        workflow:
          $ref: '#/components/schemas/ExplanationWorkflow'
      required:
      - model
      - workflow
      - agents
      - toolDecisions
      - guardrails
      - responsibility
      - trace
      type: object
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    ErrorResponse:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    Action:
      properties:
        operationId:
          type: string
        reason:
          type: string
      required:
      - operationId
      - reason
      type: object
    AgentHealth:
      properties:
        activeIncidentCount:
          type: integer
        databaseReady:
          type: boolean
        failedIncidentCount:
          type: integer
        lastAlertProcessedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        lastErrorSummary:
          type: string
        queueConsumerConfigured:
          type: boolean
        queueConsumerRunning:
          type: boolean
      required:
      - databaseReady
      - queueConsumerConfigured
      - queueConsumerRunning
      - lastAlertProcessedAt
      - lastErrorSummary
      - activeIncidentCount
      - failedIncidentCount
      type: object
    AlertDetail:
      properties:
        alarmArn:
          type: string
        alarmName:
          type: string
        cloudwatchState:
          type: string
        createdAt:
          format: date-time
          type: string
        errorSummary:
          type: string
        groupKey:
          type: string
        grouped:
          type: boolean
        hostId:
          type: string
        id:
          type: string
        incident:
          anyOf:
          - $ref: '#/components/schemas/IncidentDetail'
          - type: 'null'
        incidentId:
          type: string
        occurredAt:
          format: date-time
          type: string
        reason:
          type: string
        sourceId:
          type: string
        sourceType:
          type: string
        status:
          $ref: '#/components/schemas/AlertStatus'
        timeline:
          items:
            $ref: '#/components/schemas/IncidentEvent'
          type:
          - array
          - 'null'
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - sourceId
      - sourceType
      - alarmArn
      - alarmName
      - cloudwatchState
      - hostId
      - reason
      - status
      - groupKey
      - incidentId
      - grouped
      - errorSummary
      - occurredAt
      - createdAt
      - updatedAt
      - incident
      - timeline
      type: object
    AlertListResponse:
      properties:
        alerts:
          items:
            $ref: '#/components/schemas/ManagedAlert'
          type:
          - array
          - 'null'
        nextCursor:
          type: string
      required:
      - alerts
      type: object
    AlertStatus:
      type: string
      enum:
      - RECEIVED
      - TRIAGING
      - TRIAGED
      - PENDING_APPROVAL
      - EXECUTING
      - RESOLVED
      - REJECTED
      - FAILED
    ApprovalDecisionAudit:
      properties:
        actor:
          type: string
        createdAt:
          format: date-time
          type: string
        decision:
          type: string
        errorReason:
          type: string
        id:
          type: string
        incidentId:
          type: string
        outcome:
          $ref: '#/components/schemas/ApprovalOutcome'
        submittedPlanHash:
          type: string
      required:
      - id
      - incidentId
      - actor
      - decision
      - submittedPlanHash
      - outcome
      - errorReason
      - createdAt
      type: object
    ApprovalOutcome:
      type: string
      enum:
      - SUCCEEDED
      - DENIED
      - CONFLICT
      - NOT_FOUND
    AutomationRun:
      properties:
        createdAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        hostId:
          type: string
        incidentId:
          type: string
        operationsUrl:
          type: string
        ownerInstanceId:
          type: string
        ownerPodId:
          type: string
        runId:
          type: string
        status:
          type: string
      required:
      - runId
      - incidentId
      - hostId
      - ownerPodId
      - ownerInstanceId
      - operationsUrl
      - status
      - createdAt
      - expiresAt
      type: object
    AutomationRunRequest:
      properties:
        allowedOperations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        hostId:
          type: string
          minLength: 1
        incidentId:
          type: string
          minLength: 1
        phase:
          type: string
          minLength: 1
        planHash:
          type: string
      required:
      - incidentId
      - hostId
      - phase
      - allowedOperations
      type: object
    AutomationRunResponse:
      properties:
        capabilityToken:
          type: string
        createdAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        hostId:
          type: string
        incidentId:
          type: string
        operationsUrl:
          type: string
        ownerInstanceId:
          type: string
        ownerPodId:
          type: string
        runId:
          type: string
        status:
          type: string
        tokenExpiresAt:
          format: date-time
          type: string
      required:
      - runId
      - incidentId
      - hostId
      - ownerPodId
      - ownerInstanceId
      - operationsUrl
      - status
      - createdAt
      - expiresAt
      - capabilityToken
      - tokenExpiresAt
      type: object
    AutomationTokenRequest:
      properties:
        allowedOperations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        phase:
          type: string
          minLength: 1
        planHash:
          type: string
      required:
      - phase
      - allowedOperations
      type: object
    AutomationTokenResponse:
      properties:
        capabilityToken:
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
      - capabilityToken
      - expiresAt
      type: object
    ExplanationAgent:
      properties:
        handoffTo:
          type: string
        inputs:
          items:
            type: string
          type:
          - array
          - 'null'
        memory:
          type: string
        name:
          type: string
        outputs:
          items:
            type: string
          type:
          - array
          - 'null'
        purpose:
          type: string
        reasoningType:
          type: string
        responsibilities:
          items:
            type: string
          type:
          - array
          - 'null'
        tools:
          items:
            type: string
          type:
          - array
          - 'null'
      required:
      - name
      - purpose
      - responsibilities
      - reasoningType
      - memory
      - tools
      - inputs
      - outputs
      - handoffTo
      type: object
    ExplanationAgentAction:
      properties:
        actorType:
          type: string
        durationMs:
          type: number
        eventId:
          type: string
        fallbackUsed:
          type: boolean
        fromAgent:
          type: string
        occurredAt:
          format: date-time
          type: string
        protocol:
          type: string
        stage:
          type: string
        status:
          type: string
        summary:
          type: string
        toAgent:
          type: string
      required:
      - eventId
      - stage
      - fromAgent
      - toAgent
      - protocol
      - actorType
      - status
      - summary
      - durationMs
      - fallbackUsed
      - occurredAt
      type: object
    ExplanationGuardrail:
      properties:
        name:
          type: string
        passed:
          type: boolean
        reason:
          type: string
      required:
      - name
      - passed
      - reason
      type: object
    ExplanationModel:
      properties:
        awsRegion:
          type: string
        gatewayRoute:
          type: string
        maxPromptBytes:
          type: integer
        modelId:
          type: string
        plannerType:
          type: string
        promptTemplates:
          additionalProperties:
            type: string
          type:
          - object
          - 'null'
        provider:
          type: string
        temperature:
          anyOf:
          - type: number
          - type: 'null'
      required:
      - provider
      - plannerType
      - modelId
      - awsRegion
      - gatewayRoute
      - temperature
      - maxPromptBytes
      - promptTemplates
      type: object
    ExplanationResponsibility:
      properties:
        executionOwner:
          type: string
        humanApprovalRequired:
          type: boolean
        modelAdvisory:
          type: boolean
        terminalTraffic:
          type: string
        tokenIssuer:
          type: string
      required:
      - modelAdvisory
      - humanApprovalRequired
      - executionOwner
      - tokenIssuer
      - terminalTraffic
      type: object
    ExplanationToolCall:
      properties:
        durationMs:
          type: number
        eventId:
          type: string
        exitCode:
          type: integer
        occurredAt:
          format: date-time
          type: string
        operationId:
          type: string
        outputTruncated:
          type: boolean
        phase:
          type: string
        reason:
          type: string
        resultDigest:
          type: string
        selectedBy:
          type: string
        status:
          type: string
      required:
      - eventId
      - operationId
      - phase
      - selectedBy
      - status
      - reason
      - durationMs
      - exitCode
      - resultDigest
      - outputTruncated
      - occurredAt
      type: object
    ExplanationToolDecision:
      properties:
        chosenBy:
          type: string
        operationId:
          type: string
        phase:
          type: string
        reason:
