openapi: 3.1.0
info:
  title: DenDenMushi Agent Control Plane API
  version: 0.1.0
  description: "Agentic AI API and internal bounded automation control plane. Business endpoints require the `x-api-version: 1` header; probe and OpenAPI endpoints are exempt."
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /agentic-ai/health:
    get:
      summary: Agentic AI operational health
      security:
        - albCognito: []
      responses:
        "200":
          description: Safe health metadata.
  /alerts:
    get:
      summary: List managed-server alerts
      security:
        - albCognito: []
      parameters:
        - name: incidentId
          in: query
          schema: { type: string }
        - name: hostId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: cloudwatchState
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Alert list.
  /alerts/{alertId}:
    get:
      summary: Get one managed-server alert
      security:
        - albCognito: []
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Alert detail.
        "404":
          description: Alert not found.
  /incidents:
    get:
      summary: List incidents
      security:
        - albCognito: []
      parameters:
        - name: incidentId
          in: query
          schema: { type: string }
        - name: alertId
          in: query
          schema: { type: string }
        - name: hostId
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Incident list or HTML page.
  /incidents/events:
    get:
      summary: Query Agentic AI incident timeline metadata events
      security:
        - albCognito: []
      parameters:
        - name: incidentId
          in: query
          schema: { type: string }
        - name: alertId
          in: query
          schema: { type: string }
        - name: eventType
          in: query
          schema: { type: string }
        - name: actor
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Metadata event list without prompts, tokens, secrets, or terminal streams.
  /incidents/{incidentId}:
    get:
      summary: Get one incident
      security:
        - albCognito: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Incident detail or HTML page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  explanation:
                    $ref: "#/components/schemas/IncidentExplanation"
        "404":
          description: Incident not found.
  /incidents/{incidentId}/approve:
    post:
      summary: Approve an exact stored remediation plan
      security:
        - albCognito: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated incident detail for JSON callers, or redirect for HTML callers.
        "403":
          description: Manager or Admin group required.
        "409":
          description: Plan hash drift or expiry.
  /incidents/{incidentId}/reject:
    post:
      summary: Reject an exact stored remediation plan
      security:
        - albCognito: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated incident detail for JSON callers, or redirect for HTML callers.
  /automation/runs/start:
    post:
      summary: Start a bounded automation run
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Active automation run metadata; no capability token is returned.
  /automation/runs/{runId}/token:
    post:
      summary: Issue a state-checked capability to the authenticated Tool Gateway
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Automation run and capability token.
  /automation/runs/{runId}/close:
    post:
      summary: Close an automation run for the authenticated coordinator
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Closed.
components:
  securitySchemes:
    albCognito:
      type: apiKey
      in: header
      name: x-amzn-oidc-data
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    IncidentExplanation:
      type: object
      properties:
        model:
          type: object
          properties:
            provider: { type: string }
            plannerType: { type: string }
            modelId: { type: string }
            awsRegion: { type: string }
            gatewayRoute: { type: string }
            temperature: { type: number, nullable: true }
            maxPromptBytes: { type: integer }
            promptTemplates:
              type: object
              additionalProperties: { type: string }
        workflow:
          type: object
          properties:
            graphVersion: { type: string }
            catalogVersion: { type: string }
            diagnosticOperations:
              type: array
              items: { type: string }
            verificationOperations:
              type: array
              items: { type: string }
            runId: { type: string }
            planHash: { type: string }
        agents:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              purpose: { type: string }
              responsibilities:
                type: array
                items: { type: string }
              reasoningType: { type: string }
              memory: { type: string }
              tools:
                type: array
                items: { type: string }
              inputs:
                type: array
                items: { type: string }
              outputs:
                type: array
                items: { type: string }
              handoffTo: { type: string }
        toolDecisions:
          type: array
          items:
            type: object
            properties:
              operationId: { type: string }
              phase: { type: string }
              chosenBy: { type: string }
              reason: { type: string }
        guardrails:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              passed: { type: boolean }
              reason: { type: string }
        responsibility:
          type: object
          properties:
            modelAdvisory: { type: boolean }
            humanApprovalRequired: { type: boolean }
            executionOwner: { type: string }
            tokenIssuer: { type: string }
            terminalTraffic: { type: string }
        trace:
          type: object
          description: Sanitized per-run agent and bounded tool activity. It excludes prompts, model responses, tokens, command bodies, secrets, and terminal streams.
          properties:
            schemaVersion: { type: string, enum: [v1] }
            agentActions:
              type: array
              items:
                type: object
                properties:
                  eventId: { type: string }
                  stage: { type: string }
                  fromAgent: { type: string }
                  toAgent: { type: string }
                  protocol: { type: string }
                  actorType: { type: string, enum: [MODEL_ASSISTED, DETERMINISTIC] }
                  status: { type: string, enum: [SUCCEEDED, FALLBACK, FAILED] }
                  summary: { type: string }
                  durationMs: { type: number }
                  fallbackUsed: { type: boolean }
                  occurredAt: { type: string, format: date-time }
            toolCalls:
              type: array
              items:
                type: object
                properties:
                  eventId: { type: string }
                  operationId: { type: string }
                  phase: { type: string, enum: [diagnose, remediate, verify] }
                  selectedBy: { type: string }
                  status: { type: string, enum: [SUCCEEDED, FAILED] }
                  reason: { type: string }
                  durationMs: { type: number }
                  exitCode: { type: integer }
                  resultDigest: { type: string }
                  outputTruncated: { type: boolean }
                  occurredAt: { type: string, format: date-time }
